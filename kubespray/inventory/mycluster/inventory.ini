# Kubespray inventory — 1 control plane (+ stacked etcd), 2 workers.
# ansible_host = where Ansible connects via SSH; ip = address Kubernetes binds to.

[kube_control_plane]
master-1 ansible_host=10.10.1.10 ip=10.10.1.10 etcd_member_name=etcd1

[etcd:children]
kube_control_plane

[kube_node]
worker-1 ansible_host=10.10.1.11 ip=10.10.1.11
worker-2 ansible_host=10.10.1.12 ip=10.10.1.12

[all:vars]
ansible_user=azureuser
ansible_python_interpreter=/usr/bin/python3
