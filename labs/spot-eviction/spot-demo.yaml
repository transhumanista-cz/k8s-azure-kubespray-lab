# Workload that PREFERS the Spot node — used to observe what happens when the
# Spot VM is evicted (az vm deallocate). The preference is soft on purpose:
# after eviction the pods must be able to move to worker-1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spot-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: spot-demo
  template:
    metadata:
      labels:
        app: spot-demo
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: lifecycle
                    operator: In
                    values: ["spot"]
      tolerations:
        - key: lifecycle
          operator: Equal
          value: spot
          effect: PreferNoSchedule
      containers:
        - name: nginx
          image: nginx:1.30
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
