# Helm values for skyhook/radar (chart 1.20.x) — Kubernetes web UI.
# Anything not set here comes from chart defaults: helm show values skyhook/radar

# Never schedule on the Spot node. The taint on worker-2 is soft (PreferNoSchedule);
# required node affinity gives a hard guarantee. The control plane is excluded by its own taint.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: lifecycle
              operator: NotIn
              values: ["spot"]

# Read-only permissions. Radar's default auth mode is "none", so whoever reaches
# the UI gets Radar's ServiceAccount rights — keep them minimal.
rbac:
  podLogs: true
  metrics: true
  podExec: false
  portForward: false
  helm: false
  secrets: false

# Internal only. Access via: kubectl port-forward svc/radar 9280:9280 -n radar
service:
  type: ClusterIP
  port: 9280

# Default CPU limit is 2 (a whole node here); B-series VMs are burstable — cap it.
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
