# Health-check traffic against the Odoo Service (2 requests/s) — prints OK / FAIL.
#   kubectl -n odoo logs -f loadgen
apiVersion: v1
kind: Pod
metadata:
  name: loadgen
  namespace: odoo
spec:
  nodeName: worker-1
  containers:
    - name: loadgen
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          err=0
          while true; do
            if wget -q -T 2 -O /dev/null http://odoo:8069/web/health 2>/dev/null; then
              echo "$(date +%T) OK"
            else
              err=$((err+1))
              echo "$(date +%T) FAIL ------------------------- errors=$err"
            fi
            sleep 0.5
          done
